# Builds the debug APK on every push and publishes it to the orphan branch
# "apk-builds" (single force-pushed commit, so the repo does not grow).
# Same delivery pipeline as the Pravka app: the keyboard's updater reads
# build-info.txt from that branch, and the development session can fetch
# the APK from there too.
#
# versionCode = 10000 + run number, so every CI build installs over the
# previous one. apk-builds is shared by all branches, so build-info.txt
# names the branch: the updater only takes builds of its own branch.
name: build-apk

on:
  push:
    branches: ["**"]
    paths-ignore: ["README.md"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Build debug APK
        run: >-
          ./gradlew assembleDebug
          -PbuildNumber=${{ github.run_number }}
          -PbuildBranch=${{ github.ref_name }}
          --no-daemon

      - name: Publish APK to apk-builds branch
        run: |
          APK=$(ls app/build/outputs/apk/debug/*-debug*.apk | head -1)
          test -f "$APK"
          mkdir /tmp/apkpub
          cp "$APK" /tmp/apkpub/pravkaboard-debug.apk
          {
            echo "versionName=4.0-pravka.${{ github.run_number }}"
            echo "versionCode=$((10000 + ${{ github.run_number }}))"
            echo "apk=pravkaboard-debug.apk"
            echo "commit=${GITHUB_SHA}"
            echo "branch=${GITHUB_REF_NAME}"
            echo "builtAt=$(date -u +%Y-%m-%dT%H:%MZ)"
          } > /tmp/apkpub/build-info.txt
          cd /tmp/apkpub
          git init -q -b apk-builds
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "PravkaBoard debug APK build ${{ github.run_number }} from ${GITHUB_SHA::7} (${GITHUB_REF_NAME})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" apk-builds

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: pravkaboard-debug-apk
          path: app/build/outputs/apk/debug/*-debug*.apk
